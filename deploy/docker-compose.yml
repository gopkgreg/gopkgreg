# gopkgreg behind Caddy with automatic HTTPS.
#
#   cp gopkgreg.env.example gopkgreg.env   # then fill it in
#   docker compose up -d
#   docker compose logs -f gopkgreg
services:
  gopkgreg:
    image: ghcr.io/gopkgreg/gopkgreg:latest
    build: ..
    restart: unless-stopped
    env_file: gopkgreg.env
    environment:
      GOPKGREG_TRUST_PROXY: "true" # client IPs come from Caddy's X-Forwarded-For
    volumes:
      - gopkgreg-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: gopkgreg.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gopkgreg

  # Opt-in continuous replication of the database to S3 (see README):
  #   docker compose --profile litestream up -d
  litestream:
    image: litestream/litestream:0.3
    profiles: ["litestream"]
    restart: unless-stopped
    user: "65532:65532" # the registry image's user, so both can write the database files
    env_file: gopkgreg.env
    command: replicate
    volumes:
      - gopkgreg-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - gopkgreg

volumes:
  gopkgreg-data:
  caddy-data:
  caddy-config:
